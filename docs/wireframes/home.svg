<text x="388" y="174" fill="#284b85" font-size="27" font-weight="650" text-anchor="middle">your project.</text>
<text x="388" y="198" fill="#4d5c71" font-size="14" font-weight="400" text-anchor="middle">An AI interviewer asks spoken follow-ups, then scores you.</text>
