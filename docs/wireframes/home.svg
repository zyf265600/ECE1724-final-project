<text x="48" y="270" fill="#284b85" font-size="11" font-weight="650" text-anchor="start">SPOKEN FOLLOW-UPS</text>
<text x="48" y="296" fill="#182337" font-size="20" font-weight="650" text-anchor="start">Every question comes from your answer.</text>
<text x="48" y="320" fill="#4d5c71" font-size="13" font-weight="400" text-anchor="start">Follow-ups are written from your transcript, at your difficulty.</text>
<text x="48" y="378" fill="#284b85" font-size="11" font-weight="650" text-anchor="start">MEETING ROOM</text>
<text x="48" y="404" fill="#182337" font-size="20" font-weight="650" text-anchor="start">Answer out loud, at your own pace.</text>
<text x="48" y="428" fill="#4d5c71" font-size="13" font-weight="400" text-anchor="start">Spoken questions with live captions; press Finish answer when done.</text>
