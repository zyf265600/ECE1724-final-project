<title id="title">Home wireframes</title><desc id="description">A product introduction in five full-screen sections over photos: the hero with Start a new interview, spoken follow-ups, the meeting room, the scored report, and a closing call to start. Each scroll stops on a section. The phone shows the hero in one column.</desc>
