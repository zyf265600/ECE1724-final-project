<text x="420" y="512" fill="#182337" font-size="20" font-weight="650" text-anchor="start">Know exactly what to fix next.</text>
<text x="420" y="536" fill="#4d5c71" font-size="13" font-weight="400" text-anchor="start">Five skills, 1 to 4; quotes you can play back.</text>
<text x="388" y="598" fill="#182337" font-size="22" font-weight="650" text-anchor="middle">Ready when you are.</text>
<text x="388" y="618" fill="#4d5c71" font-size="13" font-weight="400" text-anchor="middle">Bring one project you built. Use Chrome or Edge with a microphone.</text>
